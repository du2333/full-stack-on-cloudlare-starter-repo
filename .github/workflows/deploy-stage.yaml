name: Deploy stage to Cloudflare

on:
    push:
        branches:
            - stage
        paths-ignore:
            - "**/README.md"

jobs:
    deploy-stage:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Deploy
              run: |
                  pnpm run deploy-stage-frontend && pnpm run deploy-stage-data-service
              env:
                  # Cloudflare variables
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  VITE_BASE_HOST: ${{ vars.VITE_BASE_HOST_STAGE }}
                  CLOUDFLARE_ENV: stage
